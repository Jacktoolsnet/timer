<rect width="800" height="420" rx="22" fill="var(--surface,#fbfcf8)"/><rect width="800" height="420" rx="22" fill="url(#nt-grid)"/>
<ellipse cx="405" cy="225" rx="335" ry="190" fill="url(#nt-glow)"/>
