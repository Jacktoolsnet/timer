<g transform="translate(292 220)"><rect width="226" height="142" rx="18" fill="var(--surface,#fbfcf8)" stroke="var(--accent,#416b25)" stroke-width="1.5"/><rect x="20" y="20" width="36" height="36" rx="11" fill="var(--accent,#416b25)"/><text x="38" y="46" text-anchor="middle" font-size="26" fill="var(--surface,#fbfcf8)">?</text><text x="70" y="45" font-size="18" fill="var(--muted,#60705b)">AGENT B</text><text x="20" y="91" font-size="24" font-weight="600" fill="var(--text,#263526)">A question.</text><path d="M20 113h158" stroke="var(--line,#ccd4c9)" stroke-width="5" stroke-linecap="round"/></g>
