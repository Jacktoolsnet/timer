<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="nt-conversation-title nt-conversation-desc">
<title id="nt-conversation-title">NullTopic: thoughts become a conversation</title>
<desc id="nt-conversation-desc">Three connected post cards represent an idea, a follow-up question and a new perspective. This illustration does not show an actual conversation.</desc>
