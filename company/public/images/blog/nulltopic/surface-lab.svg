<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="surface-lab-title" aria-describedby="surface-lab-desc">
<title id="surface-lab-title">Ein Surface Book bekommt eine neue Aufgabe</title>
<desc id="surface-lab-desc">Ein schematisches Notebook mit Arch Linux, GNOME, Open WebUI und Terminal. Daneben ist die OpenAI-API als vorgesehener Modellzugang dargestellt. Eine gestrichelte Karte kennzeichnet die noch geplanten Agenten. Es werden keine echten Schlüssel oder Bildschirmaufnahmen gezeigt.</desc>
<defs><pattern id="surface-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="var(--line,#cbd4c6)" stroke-width=".6" opacity=".6"/></pattern><radialGradient id="surface-glow"><stop stop-color="var(--accent,#416b25)" stop-opacity=".16"/><stop offset="1" stop-color="var(--accent,#416b25)" stop-opacity="0"/></radialGradient></defs>
<rect width="800" height="460" rx="22" fill="var(--surface,#fbfcf8)"/><rect width="800" height="460" rx="22" fill="url(#surface-grid)"/><ellipse cx="280" cy="230" rx="310" ry="220" fill="url(#surface-glow)"/>
<g font-family="system-ui,sans-serif" fill="var(--text,#263526)">
<text x="34" y="49" fill="var(--muted,#60705b)" font-size="15" letter-spacing="3">VORHANDENE HARDWARE / NEUE AUFGABE</text>
<g fill="none" stroke="var(--accent,#416b25)" stroke-width="2" stroke-dasharray="6 7"><path d="M490 180h72"/><path d="M490 285h40q20 0 20 20h12"/></g>
<rect x="64" y="99" width="426" height="240" rx="15" fill="var(--bg,#eef2e8)" stroke="var(--line,#cbd4c6)" stroke-width="2"/>
<circle cx="277" cy="111" r="3" fill="var(--muted,#60705b)"/>
<rect x="79" y="124" width="396" height="196" rx="5" fill="var(--accent-soft,#e5eddb)"/>
<text x="98" y="154" font-size="20" font-weight="600">Arch Linux · GNOME</text>
<rect x="98" y="171" width="234" height="130" rx="8" fill="var(--surface,#fbfcf8)" stroke="var(--line,#cbd4c6)"/>
<text x="115" y="201" font-size="20" fill="var(--accent,#416b25)">Open WebUI</text>
<rect x="115" y="219" width="156" height="12" rx="6" fill="var(--accent-soft,#e5eddb)"/><rect x="147" y="246" width="166" height="12" rx="6" fill="var(--line,#cbd4c6)" opacity=".6"/>
<rect x="289" y="242" width="166" height="63" rx="7" fill="var(--text,#263526)"/><text x="304" y="280" font-size="23" font-family="monospace" fill="var(--surface,#fbfcf8)">$ _</text>
<path d="M64 339h426l30 21q3 8-10 8H44q-13 0-10-8Z" fill="var(--bg,#eef2e8)" stroke="var(--line,#cbd4c6)" stroke-width="2"/><path d="M217 340h120l-10 11H227Z" fill="var(--line,#cbd4c6)"/>
<rect x="562" y="122" width="206" height="112" rx="15" fill="var(--surface,#fbfcf8)" stroke="var(--accent,#416b25)"/>
<text x="665" y="188" text-anchor="middle" font-size="25" font-weight="600">OpenAI-API</text>
<rect x="562" y="267" width="206" height="100" rx="15" fill="var(--surface,#fbfcf8)" stroke="var(--muted,#60705b)" stroke-dasharray="5 7"/>
<text x="665" y="326" text-anchor="middle" font-size="25" font-weight="600">Agenten</text>
<g font-size="18"><rect x="34" y="398" width="230" height="36" rx="10" fill="var(--accent-soft,#e5eddb)"/><text x="49" y="422">System eingerichtet</text><rect x="282" y="398" width="230" height="36" rx="10" fill="var(--accent-soft,#e5eddb)"/><text x="297" y="422">Modellzugriff per API</text><rect x="530" y="398" width="238" height="36" rx="10" fill="var(--bg,#eef2e8)"/><text x="545" y="422">Noch keine Agenten</text></g>
</g>
</svg>
