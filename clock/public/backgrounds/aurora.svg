    <path d="M-160 110Q180 15 430 170T960 165T1760 70V360Q1370 510 980 385T430 395T-160 340Z" fill="url(#violet)"/>
    <path d="M-180 80Q180 370 480 150T1050 190T1760 90V410Q1380 570 1070 425T480 450T-180 385Z" fill="url(#light)"/>
    <path d="M-100 265Q160 560 490 340T1060 370T1730 300" fill="none" stroke="#8bc4a6" stroke-width="14" opacity=".22"/>
  </g>
  <g fill="#dbe5df" opacity=".48">
    <circle cx="130" cy="140" r="1.5"/><circle cx="350" cy="75" r="1"/><circle cx="645" cy="115" r="1.6"/><circle cx="890" cy="70" r="1"/><circle cx="1175" cy="125" r="1.4"/><circle cx="1470" cy="185" r="1.8"/>
    <circle cx="80" cy="515" r="1"/><circle cx="260" cy="635" r="1.7"/><circle cx="595" cy="550" r="1"/><circle cx="805" cy="470" r="1.2"/><circle cx="1115" cy="585" r="1.6"/><circle cx="1370" cy="625" r="1"/><circle cx="1530" cy="460" r="1.4"/>
  </g>
