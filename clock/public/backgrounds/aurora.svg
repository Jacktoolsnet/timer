<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title description">
  <title id="title">Polarlichter</title>
  <desc id="description">Sanfte grüne und violette Lichtbänder über einer dunklen nordischen Landschaft.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#112633"/><stop offset="1" stop-color="#365653"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#94b9c5" stop-opacity="0"/><stop offset=".48" stop-color="#78c9b0" stop-opacity=".38"/><stop offset=".82" stop-color="#91d1ac" stop-opacity=".58"/><stop offset="1" stop-color="#91d1ac" stop-opacity="0"/></linearGradient>
    <linearGradient id="violet" x2="0" y2="1"><stop stop-color="#b0a0cd" stop-opacity="0"/><stop offset=".65" stop-color="#a59bc6" stop-opacity=".28"/><stop offset="1" stop-color="#8ab5c4" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
