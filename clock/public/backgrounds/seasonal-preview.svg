  <linearGradient id="summer" x2="0" y2="1"><stop stop-color="#80b3c9"/><stop offset="1" stop-color="#e4dfb8"/></linearGradient>
  <linearGradient id="autumn" x2="0" y2="1"><stop stop-color="#9293ac"/><stop offset="1" stop-color="#efc39d"/></linearGradient>
  <linearGradient id="winter" x2="0" y2="1"><stop stop-color="#152635"/><stop offset="1" stop-color="#3d5362"/></linearGradient>
  <path id="trunk" d="M200 845V585M200 740L125 655M200 700L270 615" fill="none" stroke="#4f5147" stroke-width="16" stroke-linecap="round"/>
