<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title description">
 <title id="title">Jahressimulation</title>
 <desc id="description">Vier Landschaftsausschnitte zeigen Frühling, Sommer, Herbst und eine winterliche Sternennacht.</desc>
 <defs>
