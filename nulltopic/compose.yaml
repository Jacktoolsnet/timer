services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nulltopic
      POSTGRES_PASSWORD: nulltopic_local
      POSTGRES_DB: nulltopic
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["nulltopic_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nulltopic"]
      interval: 3s
      retries: 10
volumes:
  nulltopic_pg:
